<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Dog Vision Camera</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: sans-serif;
    text-align: center;
  }

  #startScreen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
    align-items: center;
  }

  #preview {
    max-width: 80%;
    max-height: 50vh;
    object-fit: contain;
  }

  button {
    padding: 12px 18px;
    font-size: 16px;
    cursor: pointer;
  }

  #cameraUI {
    display: none;
  }

  video, canvas {
    position: absolute;
    top: 0;
    left: 0;
  }

  #controls {
    position: fixed;
    bottom: 15px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 10px;
    z-index: 10;
  }
</style>
</head>
<body>

<!-- 시작 화면 -->
<div id="startScreen">
  <input type="file" accept="image/png" id="imageInput">
  <img id="preview">
  <button id="startCameraBtn">카메라 켜기</button>
</div>

<!-- 카메라 화면 -->
<div id="cameraUI">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="controls">
    <button id="switchBtn">카메라 전환</button>
  </div>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const cameraUI = document.getElementById("cameraUI");

let facingMode = "environment";
let stream;

// 이미지 미리보기
document.getElementById("imageInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  document.getElementById("preview").src = url;
});

// 카메라 시작
document.getElementById("startCameraBtn").onclick = async () => {
  startScreen.style.display = "none";
  cameraUI.style.display = "block";
  await startCamera();
};

async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode }
  });

  video.srcObject = stream;

  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    requestAnimationFrame(draw);
  };
}

// 전면 / 후면 전환
document.getElementById("switchBtn").onclick = async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
};

// ===== 개 시각 변환 로직 =====

// 인간 RGB → LMS (cone response)
function rgbToLms(r, g, b) {
  return [
    0.31399022*r + 0.63951294*g + 0.04649755*b,
    0.15537241*r + 0.75789446*g + 0.08670142*b,
    0.01775239*r + 0.10944209*g + 0.87256922*b
  ];
}

// 개는 L cone 거의 없음 → M + S 중심
function lmsToDogLms(l, m, s) {
  return [
    0,          // L 제거
    m * 0.9,
    s * 1.1
  ];
}

// LMS → RGB
function lmsToRgb(l, m, s) {
  let r =  5.47221206*l - 4.6419601*m + 0.16963708*s;
  let g = -1.1252419*l + 2.29317094*m - 0.1678952*s;
  let b =  0.02980165*l - 0.19318073*m + 1.16364789*s;

  return [
    Math.min(255, Math.max(0, r)),
    Math.min(255, Math.max(0, g)),
    Math.min(255, Math.max(0, b))
  ];
}

function draw() {
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = frame.data;

  for (let i = 0; i < d.length; i += 4) {
    const r = d[i];
    const g = d[i+1];
    const b = d[i+2];

    let [l, m, s] = rgbToLms(r, g, b);
    [l, m, s] = lmsToDogLms(l, m, s);
    let [nr, ng, nb] = lmsToRgb(l, m, s);

    // 개 시각 특유의 낮은 채도·부드러운 명도
    nr = nr * 0.95 + 10;
    ng = ng * 0.95 + 10;
    nb = nb * 0.95 + 10;

    d[i]   = nr;
    d[i+1] = ng;
    d[i+2] = nb;
  }

  ctx.putImageData(frame, 0, 0);
  requestAnimationFrame(draw);
}
</script>

</body>
</html>
