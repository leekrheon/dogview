<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Dog Vision Camera</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: black;
    overflow: hidden;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }

  .ui {
    position: fixed;
    bottom: 24px;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 10;
  }

  .shutter {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: white;
    border: 6px solid rgba(0,0,0,0.25);
  }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="ui">
  <div class="shutter"></div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.createElement("video");

navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: "environment",
    width: { ideal: 1920 },
    height: { ideal: 1080 }
  },
  audio: false
}).then(stream => {
  video.srcObject = stream;
  video.play();
});

video.onloadedmetadata = () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  requestAnimationFrame(draw);
};

function draw() {
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imageData.data;

  for (let i = 0; i < d.length; i += 4) {
    const r = d[i] / 255;
    const g = d[i + 1] / 255;
    const b = d[i + 2] / 255;

    // 1. 인간 기준 밝기 (초록 포함하지만 '색' 아님)
    const luminance = 0.299 * r + 0.587 * g + 0.114 * b;

    // 2. 개 시각 색 구성
    // - R,G : 밝기 정보만
    // - B   : 유일한 색감 채널
    let dogR = luminance;
    let dogG = luminance;
    let dogB = b;

    // 3. 노랑 영역 보정 (밝지만 색은 약하게)
    if (r > 0.6 && g > 0.6 && b < 0.4) {
      dogR = luminance * 1.05;
      dogG = luminance * 1.05;
      dogB = luminance * 0.85;
    }

    // 4. 파랑 과포화 방지
    dogB = dogB * 0.9 + luminance * 0.1;

    // 5. 전체 채도 감소 (개 시각 특성)
    const gray = (dogR + dogG + dogB) / 3;
    dogR = dogR * 0.65 + gray * 0.35;
    dogG = dogG * 0.65 + gray * 0.35;
    dogB = dogB * 0.65 + gray * 0.35;

    d[i]     = Math.min(255, Math.max(0, dogR * 255));
    d[i + 1] = Math.min(255, Math.max(0, dogG * 255));
    d[i + 2] = Math.min(255, Math.max(0, dogB * 255));
  }

  ctx.putImageData(imageData, 0, 0);
  requestAnimationFrame(draw);
}
</script>

</body>
</html>
