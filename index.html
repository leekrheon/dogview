<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Dog Vision Camera</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }

  .ui {
    position: fixed;
    bottom: 24px;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 10;
  }

  .shutter {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: white;
    border: 6px solid rgba(0,0,0,0.25);
  }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="ui">
  <div class="shutter" id="shutter"></div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.createElement("video");

navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: "environment",
    width: { ideal: 1920 },
    height: { ideal: 1080 }
  },
  audio: false
}).then(stream => {
  video.srcObject = stream;
  video.play();
});

video.onloadedmetadata = () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  requestAnimationFrame(draw);
};

function draw() {
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imageData.data;

  for (let i = 0; i < d.length; i += 4) {
    let r = d[i] / 255;
    let g = d[i+1] / 255;
    let b = d[i+2] / 255;

    // RGB → LMS (Hunt-Pointer-Estevez)
    let L = 0.31399022*r + 0.63951294*g + 0.04649755*b;
    let M = 0.15537241*r + 0.75789446*g + 0.08670142*b;
    let S = 0.01775239*r + 0.10944209*g + 0.87256922*b;

    // Dog vision: L cone 제거
    L = 0;

    // LMS → RGB
    let rr =  5.47221206*L - 4.6419601*M + 0.16963708*S;
    let gg = -1.1252419*L + 2.29317094*M - 0.1678952*S;
    let bb =  0.02980165*L - 0.19318073*M + 1.16364789*S;

    // 채도 감소 + 명암 유지
    rr = Math.min(Math.max(rr, 0), 1);
    gg = Math.min(Math.max(gg, 0), 1);
    bb = Math.min(Math.max(bb, 0), 1);

    const gray = (rr + gg + bb) / 3;
    rr = rr * 0.75 + gray * 0.25;
    gg = gg * 0.75 + gray * 0.25;
    bb = bb * 0.75 + gray * 0.25;

    d[i]   = rr * 255;
    d[i+1] = gg * 255;
    d[i+2] = bb * 255;
  }

  ctx.putImageData(imageData, 0, 0);
  requestAnimationFrame(draw);
}
</script>

</body>
</html>
